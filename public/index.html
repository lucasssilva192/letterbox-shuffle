<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letterbox Shuffle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>Letterbox Shuffle</h1>
      <p>Sorteie um filme que você ainda não viu, tirado da sua rede no Letterboxd, ou veja os mais bem avaliados das listas públicas.</p>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-network" aria-selected="true" data-mode="network">Da minha rede</button>
      <button type="button" role="tab" id="tab-top" aria-selected="false" data-mode="top">Top geral</button>
    </nav>

    <form id="form" class="card form">
      <p id="mode-help" class="help"></p>

      <label for="user">Seu perfil no Letterboxd <span id="user-optional" class="optional" hidden>(opcional)</span></label>
      <div class="input-prefix">
        <span>letterboxd.com/</span>
        <input id="user" name="user" placeholder="seu_usuario" autocomplete="off">
      </div>

      <span class="label">Gênero</span>
      <div id="genres" class="genres" role="radiogroup" aria-label="Gênero"></div>

      <div class="filters">
        <div class="field">
          <label for="yearFrom">Lançado de</label>
          <input id="yearFrom" type="number" min="1874" max="2100" placeholder="ano">
        </div>
        <div class="field">
          <label for="yearTo">até</label>
          <input id="yearTo" type="number" min="1874" max="2100" placeholder="ano">
        </div>
        <div class="field">
          <label for="decade">Década</label>
          <select id="decade"><option value="">Qualquer</option></select>
        </div>
        <div class="field">
          <label for="minRating">Nota mínima</label>
          <select id="minRating">
            <option value="">Qualquer</option>
            <option value="2.5">★ 2,5+</option>
            <option value="3">★ 3,0+</option>
            <option value="3.5">★ 3,5+</option>
            <option value="3.8">★ 3,8+</option>
            <option value="4">★ 4,0+</option>
            <option value="4.2">★ 4,2+</option>
            <option value="4.5">★ 4,5+</option>
          </select>
        </div>
        <div class="field">
          <label for="country">País</label>
          <select id="country"><option value="">Qualquer</option></select>
        </div>
      </div>

      <label id="hide-watched-row" class="check" hidden>
        <input id="hideWatched" type="checkbox"> Ocultar filmes que eu já vi (precisa do usuário)
      </label>

      <div class="actions">
        <button id="submit" type="submit">Sortear filme</button>
        <button id="clear" type="button" class="secondary">Limpar filtros</button>
      </div>
    </form>

    <section id="status" class="card status" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status-text">Carregando...</p>
      <div class="bar"><div id="bar-fill"></div></div>
    </section>

    <section id="error" class="card error" hidden></section>

    <section id="result" class="card result" hidden>
      <a id="poster-link" target="_blank" rel="noopener"><img id="poster" alt=""></a>
      <div class="info">
        <h2><a id="title" target="_blank" rel="noopener"></a> <span id="year"></span></h2>
        <p id="director" class="muted"></p>
        <div id="tags" class="tags"></div>
        <p id="description"></p>
        <div id="sources" class="sources"></div>
        <div class="actions">
          <button id="again" type="button">Sortear outro</button>
          <a id="open" class="button secondary" target="_blank" rel="noopener">Abrir no Letterboxd</a>
        </div>
      </div>
    </section>

    <section id="top" hidden>
      <p id="top-summary" class="muted"></p>
      <ol id="top-list" class="top-grid"></ol>
    </section>

    <footer>Usa apenas páginas públicas do Letterboxd. Perfis ou listas privados ficam de fora.</footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
